[package]
name = "xretype"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
default-run = "xretype"
description = "Native automation runtime, workflow daemon, and overlay for xremap on Wayland"
license = "MIT"
keywords = ["xremap", "wayland", "automation", "keyboard"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
enigo = { version = "0.6.1", default-features = false, features = ["libei_smol"] }
gtk4 = "0.10"
gtk4-layer-shell = "0.7.1"
libc = "0.2"
notify = "8.2"
notify-rust = "4.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
toml = "0.8"

[profile.release]
lto = "thin"
strip = true
